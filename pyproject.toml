[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "imolcraft"
description = "Automated Force-field tool for molecular crystal and liquid electrolytes."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Ryoma Sasaki", email = "sasaki.r.1788@m.isct.ac.jp" },
]
keywords = [
    "force field",
    "molecular dynamics",
    "molecular crystal",
    "electrolyte",
    "computational chemistry",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
# Runtime dependencies (openmm, psi4, ambertools, dmff, ...) are not installable
# from PyPI; they are provided by the conda environment. See env.yml / env_cuda.yml.
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest"]
docs = [
    "sphinx",
    "myst-parser",
    "myst-nb",
    "sphinx_rtd_theme",
]

[project.urls]
Homepage = "https://github.com/srak-uf/iMolCRAFT"
Repository = "https://github.com/srak-uf/iMolCRAFT"

[tool.setuptools.dynamic]
version = { attr = "imolcraft.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["imolcraft*"]
namespaces = false

[tool.setuptools.package-data]
imolcraft = ["data/*.xml", "data/*.ini", "data/mdp/*.mdp"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
norecursedirs = ["build", "docs", "examples", "DMFF", "openff-recharge", "*.egg-info"]
markers = [
    "g16: tests that require Gaussian 16",
    "qm: tests that require a QM engine (psi4 etc.)",
    "tp: tests for thermodynamic-property training",
    "dihedral: tests for dihedral-parameter training",
    "distance: tests for distance-scan training",
    "gmx: tests that require the GROMACS gmx binary",
]
