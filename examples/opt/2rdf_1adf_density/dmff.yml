sampling:
    init_structure: merged_supercell_bonds.pdb
    ensemble: npt
    dt_fs: 1.0
    temperature_K: 233.15
    pressure_bar: 1.0
    anneal_steps: 1
    anneal_Tmax : 400.0
    anneal_totalsteps: 0
    relax_steps: 20000
    prod_steps : 100000
    nstxout: 1000
forcefield:
    xml_list: ["Li.xml", "FSA.xml", "SN.xml"]
    residue_ratio: [1,1,2]
    rcut_nm: 1.2
opt_scheme:
    n_epochs: 400
    algo: adam
    lr: 0.0005
    neff: 30
    targets:
        density_gcm3:
            weight: 1.0
            gt: 1.568
        La_A:
            weight: 1.0
            gt: 36.82
        Lc_A:
            weight: 1.0
            gt: 40.2152
        rdf:
            Li-O:
                weight: 1.0
                elem1: Li
                elem2: O
                rcut12_A: 8.0
                gt: reference_rdf_Li_O.txt
            Li-N:
                weight: 1.0
                elem1: Li
                elem2: N
                rcut12_A: 8.0
                gt: reference_rdf_Li_N.txt
        adf:
            C-N-Li:
                weight: 1.0
                elem1: C
                elem2: N
                elem3: Li
                rcut12_A: 1.4
                rcut23_A: 2.9
                gt: reference_adf_CNLi.txt
