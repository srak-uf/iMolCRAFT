sampling:
    init_structure: supercell_bonds.pdb
    ensemble: anisonpt
    dt_fs: 1.0
    rcut_nm: 0.85
    nonbondedmethod: LJPME
    temperature_K: 233.15
    pressure_bar: 1.0
    # anneal_T: the temperatures the run passes through
    # anneal_steps: MD steps of each ramp between them (one entry fewer than anneal_T)
    # e.g. anneal_T: [300.0, 400.0, 300.0] / anneal_steps: [5000, 5000]
    #      -> 300 K to 400 K over 5000 steps, then back to 300 K over 5000 steps
    anneal_T: null
    anneal_steps: null
    anneal_interval: 100
    relax_steps: 20000
    prod_steps : 100000
    nstxout: 1000
    neff: 50
    dispcorr: False
targets:
    density_gcm3:
        weight: 1.0
        gt: 1.568
    La_A:
        weight: 1.0
        gt: 24.188
    Lc_A:
        weight: 1.0
        gt: 20.108
    rdf:
        Li-O:
            weight: 1.0
            elem1: Li
            elem2: O
            rcut12_A: 8.0
            gt: reference_rdf_Li_O.txt
        Li-N:
            weight: 1.0
            elem1: Li
            elem2: N
            rcut12_A: 8.0
            gt: reference_rdf_Li_N.txt
    adf:
        C-N-Li:
            weight: 1.0
            elem1: C
            elem2: N
            elem3: Li
            rcut12_A: 1.4
            rcut23_A: 2.9
            gt: reference_adf_CNLi.txt
