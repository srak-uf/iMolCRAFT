sampling:
    init_structure: merged_supercell_bonds.pdb
    ensemble: anisonpt
    dt_fs: 1.0
    rcut_nm: 0.8
    nonbondedmethod: LJPME
    temperature_K: 233.15
    pressure_bar: 1.0
    # anneal_T は温度点、anneal_steps は各レグの MD ステップ数（1 つ少ない）
    # 例: anneal_T: [300.0, 400.0, 300.0] / anneal_steps: [5000, 5000]
    anneal_T: null
    anneal_steps: null
    anneal_interval: 100
    relax_steps: 20000
    prod_steps : 200000
    nstxout: 1000
    neff: 50
    dispcorr: False
targets:
    La_A:
        weight: 0.1
        gt: 24.188
    Lb_A:
        weight: 0.1
        gt: 24.188
    Lc_A:
        weight: 0.1
        gt: 20.1076
    rdf:
        Li-O:
            weight: 1.0
            elem1: Li
            elem2: O
            rcut12_A: 8.0
            gt: reference_rdf_Li_O.txt
        Li-N:
            weight: 1.0
            elem1: Li
            elem2: N
            rcut12_A: 8.0
            gt: reference_rdf_Li_N.txt
    adf:
        C-N-Li:
            weight: 1.0
            elem1: C
            elem2: N
            elem3: Li
            rcut12_A: 1.4
            rcut23_A: 2.9
            gt: reference_adf_CNLi.txt
